[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mestrado-llm-avaliador"
version = "0.1.0"
description = "LLMs como usuários simulados para avaliar explicações de recomendação (filmes e música)."
authors = [{ name = "Victor Oliveira Lima Pontes" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "nltk",
    "pyyaml",
    "tabulate",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["src"]
